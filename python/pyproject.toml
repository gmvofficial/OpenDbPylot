[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "opendbpylot"
version = "0.1.0"
description = "opendbpylot — natural-language → SQL via Retrieval-Augmented Generation (Python bindings)"
license = "Apache-2.0"
requires-python = ">=3.9"
readme = "README.md"
keywords = ["nl2sql", "text-to-sql", "rag", "llm", "sql", "database"]
authors = [{ name = "Global Mind Venture", email = "globalmindventure.official@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
dbpylot = "opendbpylot.cli:main"

[project.urls]
Homepage = "https://github.com/gmvofficial/OpenDbPylot"
Repository = "https://github.com/gmvofficial/OpenDbPylot"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "opendbpylot._native"
