name: Release binaries (GitHub Release assets)

# Builds the standalone `dbpylot` binary for every supported platform and
# attaches each as a GitHub Release asset named `dbpylot-<target-triple>`
# (with `.exe` on Windows). These are what OpenPylot's one-click "Install"
# button downloads — no toolchain required on the user's machine.
#
# Fires on the same `v*` tag as the crates.io release, so one tag produces
# both the published crate and the downloadable binaries.
#
# The web UI is embedded at compile time from the committed
# `frontends/dist/opendbpylot-components.js`; make sure it's fresh before tagging.
#
# How to release:  git tag v0.2.0 && git push origin v0.2.0
# Manual run (Actions tab → Run workflow) builds all platforms without uploading.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create/attach GitHub Release assets

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bin-${{ matrix.target }}

      - name: Build dbpylot (release, default features)
        run: cargo build --release --bin dbpylot --target ${{ matrix.target }}

      - name: Stage the release asset
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          src="target/${{ matrix.target }}/release/dbpylot${ext}"
          dest="dbpylot-${{ matrix.target }}${ext}"
          cp "$src" "$dest"
          # Publish a checksum alongside each binary for verification.
          if command -v sha256sum >/dev/null; then
            sha256sum "$dest" > "$dest.sha256"
          else
            shasum -a 256 "$dest" > "$dest.sha256"
          fi
          ls -la "$dest" "$dest.sha256"

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dbpylot-${{ matrix.target }}*
          fail_on_unmatched_files: true
