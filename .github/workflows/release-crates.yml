name: Release crates.io

# Publishes the `opendbpylot` crate to crates.io.
#
# The web UI is embedded at compile time from the committed
# `frontends/dist/opendbpylot-components.js`, so make sure that bundle is fresh
# (`cd frontends && npm run build`) and committed BEFORE tagging.
#
# How to release:
#   1. Add a crates.io API token as the repo secret CARGO_REGISTRY_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   2. Bump `version` in Cargo.toml and commit (with an up-to-date Cargo.lock).
#   3. Tag and push:  git tag v0.1.0 && git push origin v0.1.0
#
# Run it manually (Actions tab → Run workflow) to do a `--dry-run` without publishing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tag push → publish for real. Manual run → dry-run only (safety).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry run (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cargo publish --locked --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
